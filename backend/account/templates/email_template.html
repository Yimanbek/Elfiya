<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .btn:hover { background-color: #d4a017 !important; }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td style="padding: 20px 0 30px 0;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; border: 1px solid #eeeeee; background-color: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                    <tr>
                        <td align="center" style="padding: 40px 0 30px 0; background-color: #fcfcfc;">
                            <h1 style="margin: 0; color: #7C3AED; font-size: 32px; letter-spacing: 2px;">✨ Cafe Efa</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px 40px 30px;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="color: #2d3436; font-size: 24px; font-weight: bold; text-align: center;">
                                        {{ title }}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 20px 0 30px 0; color: #636e72; font-size: 16px; line-height: 24px; text-align: center;">
                                        {{ message }}
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center">
                                        <a href="{{ link }}" class="btn" style="background-color: #8B5CF6; color: #ffffff; padding: 15px 35px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; box-shadow: 0 4px 6px rgba(0,184,148,0.2);">
                                            {{ btn_text }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 30px 30px 30px 30px; background-color: #f1f2f6; color: #b2bec3; font-size: 12px; text-align: center;">
                            <p style="margin: 0;">&copy; 2026 Efa Cafe. Бишкек, Кыргызстан.</p>
                            <p style="margin: 5px 0 0 0;">Если вы не запрашивали это письмо, просто проигнорируйте его.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
